[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-transformer"
version = "1.0.0"
description = "A Transformer model for bidirectional translation between natural language and genetic codes (DNA, RNA, codons, amino acids, proteins)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Namash Aggarwal"}]
keywords = ["transformer", "genetics", "bioinformatics", "deep-learning", "attention", "codon", "protein", "dna", "rna"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "flake8", "black", "isort", "mypy"]
notebook = ["jupyter>=1.0.0", "ipywidgets>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["genetic_transformer*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
